<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gambar ke CDN URL</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f172a; color: #e2e8f0;
    min-height: 100vh; display: flex; justify-content: center;
    padding: 40px 20px;
  }
  .container { width: 100%; max-width: 640px; }
  h1 { font-size: 1.6rem; margin-bottom: 8px; }
  .subtitle { color: #94a3b8; font-size: 0.9rem; margin-bottom: 28px; }

  /* Area konfigurasi */
  .config {
    background: #1e293b; border-radius: 12px;
    padding: 20px; margin-bottom: 20px;
    border: 1px solid #334155;
  }
  .config label { display: block; font-size: 0.82rem; color: #94a3b8; margin-bottom: 6px; }
  .config input {
    width: 100%; padding: 10px 14px; margin-bottom: 14px;
    background: #0f172a; border: 1px solid #334155;
    border-radius: 8px; color: #e2e8f0; font-size: 0.9rem;
    outline: none; transition: border-color .2s;
  }
  .config input:focus { border-color: #3b82f6; }
  .config input::placeholder { color: #475569; }
  .config-row { display: flex; gap: 12px; }
  .config-row > div { flex: 1; }
  .btn-save {
    width: 100%; padding: 10px; background: #3b82f6;
    color: #fff; border: none; border-radius: 8px;
    font-size: 0.9rem; cursor: pointer; font-weight: 600;
    transition: background .2s;
  }
  .btn-save:hover { background: #2563eb; }

  /* Area drag & drop */
  .dropzone {
    border: 2px dashed #475569; border-radius: 12px;
    padding: 48px 24px; text-align: center;
    cursor: pointer; transition: all .25s;
    background: #1e293b; margin-bottom: 20px;
    position: relative; overflow: hidden;
  }
  .dropzone:hover, .dropzone.dragover {
    border-color: #3b82f6; background: #1e293b;
    box-shadow: 0 0 0 3px rgba(59,130,246,.15);
  }
  .dropzone.dragover { transform: scale(1.01); }
  .dropzone .icon { font-size: 2.5rem; margin-bottom: 12px; display: block; }
  .dropzone p { color: #94a3b8; font-size: 0.9rem; }
  .dropzone strong { color: #3b82f6; cursor: pointer; }
  .dropzone input[type=file] { display: none; }

  /* Progress bar */
  .progress-wrap { margin-bottom: 20px; display: none; }
  .progress-bar {
    height: 6px; background: #334155; border-radius: 3px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: #3b82f6; border-radius: 3px;
    width: 0%; transition: width .3s ease;
  }
  .progress-text { font-size: 0.8rem; color: #94a3b8; margin-top: 6px; text-align: center; }

  /* Kartu hasil */
  .results { display: none; }
  .result-card {
    background: #1e293b; border-radius: 12px;
    padding: 16px; margin-bottom: 12px;
    border: 1px solid #334155;
    display: flex; gap: 14px; align-items: center;
    animation: fadeIn .3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } }
  .result-card img {
    width: 64px; height: 64px; object-fit: cover;
    border-radius: 8px; background: #0f172a; flex-shrink: 0;
  }
  .result-info { flex: 1; min-width: 0; }
  .result-name {
    font-size: 0.85rem; color: #cbd5e1; margin-bottom: 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .result-url {
    font-size: 0.78rem; color: #64748b; word-break: break-all;
    line-height: 1.4; max-height: 2.8em; overflow: hidden;
  }
  .copy-btn {
    flex-shrink: 0; padding: 8px 16px; background: #3b82f6;
    color: #fff; border: none; border-radius: 8px;
    font-size: 0.8rem; cursor: pointer; font-weight: 600;
    transition: all .2s; white-space: nowrap;
  }
  .copy-btn:hover { background: #2563eb; }
  .copy-btn.copied { background: #22c55e; }

  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
